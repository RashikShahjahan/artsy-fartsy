<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artsy · SFT candidates</title>
<link rel="stylesheet" href="__BASE_PATH__/assets/style.css">

<header class="workspace-header">
