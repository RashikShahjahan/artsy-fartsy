name: ArtCanvas detail API

on:
  push:
    branches:
      - feature/artcanvas-detailed-drawing
  pull_request:
    paths:
      - 'runtime/artcanvas.py'
      - 'docs/artcanvas.md'
      - 'tests/test_artcanvas_detail.py'
      - '.github/workflows/artcanvas-detail.yml'

jobs:
  detail-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cairo and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
          python -m pip install -r runtime/requirements.txt
      - name: Test ArtCanvas detailed drawing
        run: python -m unittest discover -s tests -p 'test_artcanvas_detail.py' -v
