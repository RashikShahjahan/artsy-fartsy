[project]
name = "artsy-fartsy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pycairo==1.29.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "inspect-ai==0.3.283",
    "inspect-swe==0.2.72",
    "Jinja2==3.1.6",
    "mini-swe-agent==2.2.3",
    "openai==3.37.0",
    "Pillow==12.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "tinker==0.35.0",
    "tinker-cookbook==0.5.8",
    "torchvision==0.29.1",
    "transformers==5.5.4",
    "uvicorn==0.54.0",
]

# TTS is installed separately under Python 3.12, not in the project environment.
[tool.artsy-fartsy]
tts-dependencies = ["kokoro-onnx==0.4.9"]

[tool.artsy-fartsy.roles]
"runtime/requirements.txt" = ["pycairo", "Pillow"]
"drawing/requirements.txt" = ["pycairo", "Pillow", "httpx", "mini-swe-agent"]
"evaluation/requirements.txt" = ["inspect-ai", "inspect-swe", "openai", "Pillow", "python-dotenv", "PyYAML", "httpx", "mini-swe-agent"]
"inference/requirements-tinker.txt" = ["fastapi", "uvicorn", "python-dotenv", "Jinja2", "tinker", "tinker-cookbook", "transformers", "torchvision", "pydantic", "httpx"]
"training/requirements.txt" = ["tinker", "tinker-cookbook", "torchvision", "python-dotenv", "transformers", "Pillow", "PyYAML", "httpx", "mini-swe-agent"]
"training/requirements-grpo.txt" = ["tinker", "tinker-cookbook", "torchvision", "python-dotenv", "transformers", "Pillow", "PyYAML", "httpx", "mini-swe-agent"]
"ui/requirements-tts.txt" = ["kokoro-onnx"]
