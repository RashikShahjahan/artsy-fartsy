[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artsy-harness"
version = "0.1.0"
description = "Standalone, local ArtCanvas episode harness"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0", "pycairo==1.28.0"]

[project.scripts]
artsy-harness = "artsy_harness.cli:main"

[tool.setuptools.package-data]
artsy_harness = ["fixtures/*.py"]
